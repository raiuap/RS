<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReStyle - Análisis de Prendas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50 min-h-screen">
    
    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-6">
            <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600">
                <i class="fas fa-leaf mr-2"></i>ReStyle - Análisis de Sostenibilidad
            </h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 max-w-4xl">
        
        <!-- Search Box -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
            <label class="block text-gray-700 font-semibold mb-3">
                <i class="fas fa-link mr-2 text-indigo-600"></i>URL de la prenda
            </label>
            <div class="flex gap-3">
                <input 
                    type="text" 
                    id="urlInput" 
                    placeholder="https://www.zara.com/es/es/..." 
                    class="flex-1 px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-500 focus:outline-none transition"
                />
                <button 
                    onclick="analyzeGarment()" 
                    class="px-8 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold rounded-xl hover:shadow-lg transform hover:-translate-y-0.5 transition duration-200">
                    <i class="fas fa-search mr-2"></i>Analizar
                </button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-16 w-16 border-4 border-indigo-600 border-t-transparent"></div>
            <p class="mt-4 text-gray-600 font-medium">Analizando prenda...</p>
        </div>

        <!-- Results Container -->
        <div id="results" class="hidden space-y-6">
            
            <!-- Verdict Card -->
            <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                <div id="verdictHeader" class="p-8 text-center">
                    <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-white/30 mb-4">
                        <i id="verdictIcon" class="text-5xl"></i>
                    </div>
                    <h2 class="text-3xl font-bold text-white mb-2">Sostenibilidad</h2>
                    <p id="sustainabilityVerdict" class="text-5xl font-extrabold text-white"></p>
                </div>
                
                <div class="p-6 bg-gray-50">
                    <p id="analysisSummary" class="text-gray-700 text-lg leading-relaxed"></p>
                </div>
            </div>

            <!-- Durability Card -->
            <div class="bg-white rounded-2xl shadow-lg p-8">
                <h3 class="text-2xl font-bold text-gray-800 mb-6 flex items-center">
                    <i class="fas fa-shield-alt mr-3 text-indigo-600"></i>Durabilidad
                </h3>
                
                <div class="flex items-center gap-8">
                    <!-- Circular Score -->
                    <div class="relative flex-shrink-0">
                        <svg class="w-32 h-32 transform -rotate-90">
                            <circle cx="64" cy="64" r="56" stroke="#e5e7eb" stroke-width="8" fill="none"/>
                            <circle id="durabilityCircle" cx="64" cy="64" r="56" stroke="url(#gradient)" stroke-width="8" fill="none"
                                    stroke-linecap="round" stroke-dasharray="352" stroke-dashoffset="352"
                                    class="transition-all duration-1000 ease-out"/>
                            <defs>
                                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#6366f1"/>
                                    <stop offset="100%" style="stop-color:#a855f7"/>
                                </linearGradient>
                            </defs>
                        </svg>
                        <div class="absolute inset-0 flex items-center justify-center">
                            <div class="text-center">
                                <p id="durabilityScore" class="text-4xl font-bold text-gray-800"></p>
                                <p class="text-xs text-gray-500">/ 10</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Verdict Badge -->
                    <div class="flex-1">
                        <div id="durabilityBadge" class="inline-block px-6 py-3 rounded-full font-bold text-lg"></div>
                    </div>
                </div>
            </div>

            <!-- Materials Breakdown -->
            <div class="bg-white rounded-2xl shadow-lg p-8">
                <h3 class="text-2xl font-bold text-gray-800 mb-6 flex items-center">
                    <i class="fas fa-microscope mr-3 text-indigo-600"></i>Composición de Materiales
                </h3>
                
                <div id="materialsContainer" class="space-y-4">
                    <!-- Materials will be injected here -->
                </div>
            </div>
        </div>

        <!-- Error Message -->
        <div id="error" class="hidden bg-red-50 border-2 border-red-200 rounded-2xl p-6">
            <div class="flex items-center gap-3">
                <i class="fas fa-exclamation-circle text-3xl text-red-500"></i>
                <div>
                    <h3 class="font-bold text-red-800 text-lg">Error</h3>
                    <p id="errorMessage" class="text-red-600"></p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE_URL = 'http://localhost:8081';

        async function analyzeGarment() {
            const url = document.getElementById('urlInput').value.trim();
            
            if (!url) {
                showError('Por favor, ingresa una URL válida');
                return;
            }

            // Hide previous results and show loading
            document.getElementById('results').classList.add('hidden');
            document.getElementById('error').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            try {
                const response = await fetch(`${API_BASE_URL}/api/composicion?url=${encodeURIComponent(url)}`);
                
                if (!response.ok) {
                    throw new Error('Error al obtener el análisis');
                }

                const text = await response.text();
                
                // Try to parse as JSON
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    throw new Error('El servidor no devolvió un JSON válido');
                }

                displayResults(data);
                
            } catch (error) {
                showError(error.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function displayResults(data) {
            // Set verdict with color
            const verdictColors = {
                'Excelente': { bg: 'bg-gradient-to-r from-green-500 to-emerald-600', icon: 'fas fa-star' },
                'Buena': { bg: 'bg-gradient-to-r from-green-400 to-teal-500', icon: 'fas fa-check-circle' },
                'Regular': { bg: 'bg-gradient-to-r from-yellow-400 to-orange-500', icon: 'fas fa-exclamation-triangle' },
                'Mala': { bg: 'bg-gradient-to-r from-red-500 to-pink-600', icon: 'fas fa-times-circle' }
            };

            const verdict = data.sustainabilityVerdict || 'Regular';
            const verdictStyle = verdictColors[verdict] || verdictColors['Regular'];

            const verdictHeader = document.getElementById('verdictHeader');
            verdictHeader.className = `p-8 text-center ${verdictStyle.bg}`;
            
            document.getElementById('verdictIcon').className = `${verdictStyle.icon} text-5xl text-white`;
            document.getElementById('sustainabilityVerdict').textContent = verdict;
            document.getElementById('analysisSummary').textContent = data.analysisSummary || 'Análisis no disponible';

            // Durability score
            const score = data.durabilityScore || 0;
            document.getElementById('durabilityScore').textContent = score;
            
            // Animate circular progress
            const circumference = 2 * Math.PI * 56;
            const offset = circumference - (score / 10) * circumference;
            document.getElementById('durabilityCircle').style.strokeDashoffset = offset;

            // Durability verdict badge
            const durabilityColors = {
                'Alta': 'bg-green-100 text-green-800 border-2 border-green-300',
                'Media': 'bg-yellow-100 text-yellow-800 border-2 border-yellow-300',
                'Baja': 'bg-red-100 text-red-800 border-2 border-red-300'
            };
            
            const durabilityBadge = document.getElementById('durabilityBadge');
            durabilityBadge.className = `inline-block px-6 py-3 rounded-full font-bold text-lg ${durabilityColors[data.durabilityVerdict] || durabilityColors['Media']}`;
            durabilityBadge.textContent = `Durabilidad ${data.durabilityVerdict || 'Media'}`;

            // Materials breakdown
            const materialsContainer = document.getElementById('materialsContainer');
            materialsContainer.innerHTML = '';

            if (data.materialBreakdown && data.materialBreakdown.length > 0) {
                data.materialBreakdown.forEach(material => {
                    const materialCard = createMaterialCard(material);
                    materialsContainer.appendChild(materialCard);
                });
            }

            document.getElementById('results').classList.remove('hidden');
        }

        function createMaterialCard(material) {
            const card = document.createElement('div');
            card.className = 'bg-gradient-to-r from-gray-50 to-gray-100 rounded-xl p-5 border border-gray-200 hover:shadow-md transition';
            
            card.innerHTML = `
                <div class="flex items-center justify-between mb-3">
                    <h4 class="font-bold text-gray-800 text-lg">${material.material}</h4>
                    <span class="text-2xl font-bold text-indigo-600">${material.percentage}%</span>
                </div>
                
                <div class="w-full bg-gray-200 rounded-full h-3 mb-3 overflow-hidden">
                    <div class="bg-gradient-to-r from-indigo-500 to-purple-500 h-3 rounded-full transition-all duration-1000" 
                         style="width: ${material.percentage}%"></div>
                </div>
                
                <p class="text-sm text-gray-600 flex items-start">
                    <i class="fas fa-info-circle mr-2 mt-0.5 text-indigo-500"></i>
                    <span>${material.impactNote}</span>
                </p>
            `;
            
            return card;
        }

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');
        }

        // Allow Enter key to trigger analysis
        document.getElementById('urlInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') analyzeGarment();
        });
    </script>
</body>
</html>
